<!DOCTYPE html>
<html lang="en">
<head>
    <!--Your browser reads the HTML from top to bottom.-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatibel" content="IE=edge"> <!--internet exploarer to use the most recent rendering engine edge-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer!</title> <!--title of the browser-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> <!-- contanr covers the websside, you can easuly write this .container-->
        <h1 class="title">Pomodoro Timer</h1> <!--title of the view-->
        <!--after the title we'l have paragaraph-->
        <p class="timer" id="timer">25:00</p> <!--p.timer#timer means: class of timer and #=id timer, class is for styling id for targeting them using script-->
        <!--have the buttons so we put .button-wrapper, so we creating a div with a class of button-->
        <div class="button-wrapper">
            <!--3 buttons, 1. id start, id for stop, id for reset-->
             <button id="start">Start</button>
             <button id="stop">Stop</button>
             <button id="reset">Reset</button>
        </div>



    </div>
<script src="scripts.js"></script>
</body>
</html>
